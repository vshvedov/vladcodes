
<div class="header">
    <h1 style="margin: 0; padding: 0;">
        <a href="/" style="text-decoration: none; color: inherit; display: inline-block; transition: all 0.3s ease;">
            <span style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: bold; font-size: 1.1em; letter-spacing: 0.5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">{{ site.name }}</span>
        </a>
    </h1>
    <ul>
        {% for item in site.data.navigation %}
        <li>
            <a href="{{ item.url }}"{% if item.target %} target="{{ item.target }}"{% endif %}>{{ item.title }}</a>
        </li>
        {% endfor %}
    </ul>
</div>
