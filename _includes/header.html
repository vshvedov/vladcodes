<header class="site-header" role="banner">
  <a href="/" class="site-header__brand">{{ site.name }}</a>
  <nav class="site-nav" aria-label="Primary">
    {% for item in site.data.navigation %}
      <a class="site-nav__link"
         href="{{ item.url }}"
         {% if item.target %}target="{{ item.target }}" rel="noopener"{% endif %}>
        {{ item.title }}
      </a>
    {% endfor %}
    <noscript><style>.theme-toggle{display:none !important;}</style></noscript>
    <button type="button"
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle color theme"
            title="Toggle theme (auto / light / dark)">
      <span data-theme-icon>auto</span>
    </button>
  </nav>
</header>
